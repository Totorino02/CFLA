[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CFLA"
version = "1.0.2"
description = "CFLA - a framework for clustered federated learning algorithms"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "HOUNSI Antoine", email = "antoinehounsi3@gmail.com" }
]

license = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "numpy",
    "tqdm",
    "declearn",
    "scikit-learn",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
energy = []

[project.urls]
Homepage = "https://github.com/Totorino02/CFLA"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfla*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cfla"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"